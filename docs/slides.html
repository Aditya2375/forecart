<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#0d0f14;--panel:#141821;--line:#262c3a;--tx:#e8ebf2;--mut:#8a93a6;--acc:#6ee7b7;--acc2:#7dd3fc;--warn:#fbbf24;--mono:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace}
body{margin:0;width:1280px;height:720px;background:radial-gradient(900px 400px at 75% -10%,#17313a66,transparent),var(--bg);color:var(--tx);font:26px/1.5 "DejaVu Sans",Inter,system-ui,sans-serif;overflow:hidden}
.s{padding:70px 90px}.k{font:600 16px var(--mono);color:var(--acc);letter-spacing:2px;text-transform:uppercase;margin-bottom:18px}
h1{font-size:68px;line-height:1.08;margin:0 0 24px;letter-spacing:-1.5px}h1 b{color:var(--acc)}
h2{font-size:44px;margin:0 0 26px;letter-spacing:-.8px}p{color:var(--mut);margin:0 0 16px}
.big{font:600 40px var(--mono);color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:22px 26px}
.card h3{margin:0 0 6px;font-size:26px}.card p{font-size:20px;margin:0}.card .n{font:600 14px var(--mono);color:var(--acc)}
table{border-collapse:collapse;width:100%;font:24px var(--mono)}th,td{padding:14px 18px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:400}td.g{color:var(--acc)}
.mono{font:22px/1.6 var(--mono);background:#0b0e14;border:1px solid var(--line);border-radius:14px;padding:22px 28px;color:#cdd6e6}
.foot{position:absolute;left:90px;bottom:34px;font:16px var(--mono);color:var(--mut)}
.row3{display:flex;gap:18px;margin-top:20px}.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 20px}.chip b{display:block;font:600 34px var(--mono);color:var(--acc)}.chip i{font-style:normal;font-size:15px;color:var(--mut)}
</style></head><body><div id="r"></div><script>
const S={
title:`<div class="s" style="padding-top:150px"><div class="k">AgentX · Challenge 1 · Anticipatory Commerce</div><h1>fore<b>cart</b><br>answers before the shopper finishes typing.</h1><p>Techfest 2026-27, IIT Bombay · Team Do You Care · TM-AEFE9948F9D</p></div>`,
problem:`<div class="s"><div class="k">The problem</div><h2>Shoppers type one word at a time.</h2><p>They change their mind halfway ("black, no wait, white"), add a constraint late ("oh, and in blue"), and mix Hindi with English.</p><p>Show a product too late and you earn nothing for earliness. Show the wrong one and it costs <span style="color:var(--warn)">1.0</span>, while the earliness bonus is at most <span style="color:var(--acc)">0.6</span>.</p><p style="color:var(--tx)">So: be early only when it is safe.</p></div>`,
how:`<div class="s"><div class="k">How it works</div><div class="grid"><div class="card"><div class="n">01</div><h3>Re-read everything</h3><p>Whole text so far becomes 5 filters, after every word.</p></div><div class="card"><div class="n">02</div><h3>Last mention wins</h3><p>Corrections and late constraints just rewrite a field.</p></div><div class="card"><div class="n">03</div><h3>One counted search</h3><p>Only when the reading changes and can be committed on.</p></div><div class="card"><div class="n">04</div><h3>Commit on a closer</h3><p>Unique, fully specified, and the shopper has moved on.</p></div></div></div>`,
results:`<div class="s"><div class="k">Results · organisers' evaluate.py</div><h2>Accurate, quiet, cheap.</h2><table><tr><th></th><th>score</th><th>accuracy</th><th>wrong commits</th><th>searches/req</th></tr><tr><td>forecart · dev set (300)</td><td class="g">42.3</td><td class="g">1.000</td><td class="g">0</td><td>1.13</td></tr><tr><td>starter baseline</td><td>20.0</td><td>0.527</td><td>0</td><td>1.53</td></tr><tr><td>forecart · 9,600 stress</td><td class="g">44.7</td><td class="g">1.000</td><td class="g">0</td><td>1.05</td></tr></table><p style="margin-top:22px;font-size:20px">All 5 filters correct on every dev request. About 0.2 ms per word, standard library only, no model calls.</p></div>`,
stress:`<div class="s"><div class="k">Honest about limits</div><h2>9,600 generated requests, then the bugs they found.</h2><p>stress.py builds requests from real catalogue products with wider phrasing: Hindi and English number words, synonyms, size forms, corrections.</p><p>It exposed two latent bugs: an opening "please" read as a closer, and a size next to a budget merged into it ("ten chhe hazaar" = 16,000). Both fixed.</p><p>It is our own generator. Earliness stays modest by design: 4.3% of the request on dev, against 16.3% for a perfect oracle.</p></div>`,
rezolve:`<div class="s"><div class="k">Rezolve Labs</div><h2>One counted call is the wiring point.</h2><div class="mono">filters = parse(text_so_far)<br>if changed and fully specified:<br>&nbsp;&nbsp;hits = tools.search(text, filters)  <span style="color:var(--warn)"># swap for semantic search</span><br>commit only if len(hits) == 1 and a closer was seen</div><p style="margin-top:22px;font-size:21px">Parser, commit policy and search budget stay as they are. No Rezolve code is included: no access has been issued.</p></div>`,
close:`<div class="s" style="padding-top:170px"><div class="k">Try it</div><h1>aditya2375.github.io<b>/forecart</b></h1><p>Replay real traces or type your own request.</p><p>Code: github.com/Aditya2375/forecart</p><div class="row3"><div class="chip"><b>1.000</b><i>accuracy</i></div><div class="chip"><b>0</b><i>wrong commits</i></div><div class="chip"><b>1.13</b><i>searches / request</i></div></div></div>`
};
document.getElementById("r").innerHTML=S[location.hash.slice(1)]||"";
</script></body></html>
